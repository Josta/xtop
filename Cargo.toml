[package]
name = "xtop"
version = "0.6.0"
edition = "2024"
description = "A workload-oriented Linux process explorer"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
